<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow · 让每次专注都有回报</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <span class="logo">FocusFlow</span>
      <a href="#features">功能</a>
      <a href="#pricing">定价</a>
    </nav>
  </header>

  <main>
    <!-- 首屏：一句话说清卖什么 + 一个按钮 -->
    <section id="hero">
      <h1>让每次专注，都有回报</h1>
      <p>番茄工作法计时器，自动把你的专注攒成成就墙</p>
      <button id="startBtn">免费开始</button>
      <p id="status"></p>
    </section>

    <!-- 特性区：三个卖点 -->
    <section id="features">
      <h2>三大特性</h2>
      <div class="feature">
        <h3>番茄计时</h3>
        <p>25 分钟一轮，零打扰</p>
      </div>
      <div class="feature">
        <h3>成就墙</h3>
        <p>专注时长可视化</p>
      </div>
      <div class="feature">
        <h3>数据统计</h3>
        <p>看清时间花在哪</p>
      </div>
    </section>

    <!-- 定价区：三档套餐（落地页扩展，课4） -->
    <section id="pricing">
      <h2>定价</h2>
      <div class="plan">
        <h3>Free</h3>
        <p class="price">$0<span>/月</span></p>
        <ul>
          <li>每月 25 个番茄</li>
          <li>基础统计</li>
        </ul>
      </div>
      <div class="plan">
        <h3>Pro</h3>
        <p class="price">$5<span>/月</span></p>
        <ul>
          <li>无限番茄</li>
          <li>成就墙导出</li>
        </ul>
      </div>
      <div class="plan">
        <h3>Team</h3>
        <p class="price">$15<span>/月</span></p>
        <ul>
          <li>Pro 全部</li>
          <li>团队统计</li>
        </ul>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 FocusFlow · 学习项目作品集 v1</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
